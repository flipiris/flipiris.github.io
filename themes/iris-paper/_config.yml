# 原首页文案保留在这里；精简后的首页不再输出此区块。
intro:
  eyebrow: 这个世界会好吗？
  title: 有一天<br>我会长出眼睛。
  description: 

# 侧栏第一组：不带图标的固定入口。
nav_primary:
  - label: 页面一览
    path: /archives/
  - label: 标签索引
    path: /tags/

# 侧栏第二组：带图标的分类。label 必须与文章 front-matter 里的 categories 一致；
# icon 是 Material Symbols 的图标名，需包含在 source/fonts/MaterialSymbolsOutlined.woff2 中。
# 分类还没有文章时，仍会生成一个空的分类页面。
nav_categories:
  - label: 随笔
    icon: edit_note
  - label: 文章
    icon: article
  - label: 评论
    icon: forum
  - label: 作品
    icon: palette

# 侧栏分类末尾的归档入口：收录没有上述任何分类的文章与独立页面。
nav_misc:
  label: 其他页面
  icon: folder_open
  path: /misc/
