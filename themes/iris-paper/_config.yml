# 侧栏第一组：不带图标的固定入口。
nav_primary:
  - label: 最近更新
    path: /updates/
  - label: 页面一览
    path: /archives/
  - label: 分类索引
    path: /categories/
  - label: 标签索引
    path: /tags/

# 目录即分类；顺序也决定导航顺序。子目录可继续在这里声明。
sections:
  - folder: notes
    label: 笔记
    icon: edit_note
  - folder: articles
    label: 文章
    icon: article
  - folder: reviews
    label: 评论
    icon: forum
  - folder: works
    label: 作品
    icon: palette

# 侧栏分类末尾的归档入口：收录没有上述任何分类的文章与独立页面。
nav_misc:
  label: 其他页面
  icon: folder_open
  path: /misc/

# 留空时显示禁用按钮；填写完整个人主页链接后启用。
social:
  github: 'https://github.com/flipiris'
  x: 'https://x.com/flipiris'

# 分类/标签索引：每页卡片数、每张卡片预览文章数。
taxonomy_per_page: 10
taxonomy_preview: 5
